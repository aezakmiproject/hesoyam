# Required secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, NPM_TOKEN
# Publish: bump packages/hesoyam/package.json, tag vX.Y.Z, push the tag.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        id: pkg
        run: |
          VERSION="$(node -p "require('./packages/hesoyam/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Notify publish started
        continue-on-error: true
        uses: ./.github/actions/telegram
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: |
            📦 Публикация пакета началась

            @aezakmiproject/hesoyam@${{ steps.pkg.outputs.version }}
            ${{ github.ref_name }}
            ${{ github.actor }}

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${{ steps.pkg.outputs.version }}"
          if [[ "$TAG" != "$VERSION" ]]; then
            echo "Tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Typecheck package
        run: pnpm --filter @aezakmiproject/hesoyam typecheck

      - name: Publish to npm
        run: pnpm --filter @aezakmiproject/hesoyam publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Notify package deployed
        if: success()
        continue-on-error: true
        uses: ./.github/actions/telegram
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: |
            📦 Пакет задеплоен

            @aezakmiproject/hesoyam@${{ steps.pkg.outputs.version }}
            https://www.npmjs.com/package/@aezakmiproject/hesoyam/v/${{ steps.pkg.outputs.version }}
            ${{ github.actor }}

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify publish failed
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/telegram
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: |
            ❌ Публикация пакета провалилась

            @aezakmiproject/hesoyam@${{ steps.pkg.outputs.version }}
            ${{ github.ref_name }}
            ${{ github.actor }}

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
